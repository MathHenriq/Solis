# O Solis como servidor, num Linux de verdade (26/11/2026).
#
# O cérebro na nuvem vai rodar num servidor Linux alugado. Aqui, a cada mudança
# no backend, o GitHub (grátis no repositório público) roda todos os testes num
# Ubuntu e sobe o Solis como servidor (SOLIS_SERVIDOR=1) pra conferir de fora:
# /saude responde, sem token não entra, com token entra, e o cofre de arquivo
# guarda uma chave de API criptografada.
#
# O log só abre com login no GitHub; o que importa (quantos passaram, quais
# falharam, onde travou) vira aviso na página da execução, que abre sem login.
name: Solis como servidor (Linux)

on:
  push:
    branches: [main]
    paths:
      - 'solis-repo/solis-repo/backend/**'
      - 'solis-repo/solis-repo/src/**'
      - 'solis-repo/solis-repo/index.html'
      - 'solis-repo/solis-repo/package*.json'
      - '.github/workflows/servidor.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: solis-repo/solis-repo/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: solis-repo/solis-repo/backend/requirements*.txt

      # A tela do Solis, que o servidor entrega pro celular (nuvem.py).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: solis-repo/solis-repo/package-lock.json

      - name: Constrói a tela
        timeout-minutes: 10
        working-directory: solis-repo/solis-repo
        run: npm ci && npm run build

      - name: Instala
        timeout-minutes: 10
        run: |
          set -o pipefail
          pip install -r requirements.txt -r requirements-dev.txt pytest-timeout==2.4.0 2>&1 | tee /tmp/instala.txt

      - name: Testes
        id: testes
        timeout-minutes: 20
        run: |
          set -o pipefail
          # -v: um teste por linha, então, se o passo inteiro for morto, a última
          # linha diz qual estava rodando.
          python -m pytest -v -p no:cacheprovider --timeout=60 -rfE 2>&1 | tee /tmp/testes.txt

      - name: Sobe como servidor e confere o token
        # Roda mesmo com teste falhando: são coisas diferentes.
        if: success() || steps.testes.outcome == 'failure'
        timeout-minutes: 3
        env:
          SOLIS_SERVIDOR: '1'
          SOLIS_TOKEN: token-do-teste-no-github-bem-comprido-${{ github.run_id }}
          SOLIS_BANCO: /tmp/solis/solis.db
          SOLIS_COFRE_ARQUIVO: /tmp/solis-config/cofre.chave
          SOLIS_AVISOS: '0'
        run: |
          python -m uvicorn solis.main:app --host 127.0.0.1 --port 8765 > /tmp/solis.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/saude && break; sleep 1; done
          echo
          codigo() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(codigo http://127.0.0.1:8765/saude)" = 200
          test "$(codigo http://127.0.0.1:8765/conversas)" = 401
          test "$(codigo -H 'Authorization: Bearer errado-errado-errado-errado' http://127.0.0.1:8765/conversas)" = 401
          test "$(codigo -H "Authorization: Bearer $SOLIS_TOKEN" http://127.0.0.1:8765/conversas)" = 200
          # O celular: sem cookie, o navegador vai pro /entrar; com a senha, o cookie e a tela.
          test "$(codigo -H 'Accept: text/html' http://127.0.0.1:8765/)" = 303
          test "$(codigo -c /tmp/biscoito -d "token=$SOLIS_TOKEN" http://127.0.0.1:8765/entrar)" = 303
          curl -sf -b /tmp/biscoito http://127.0.0.1:8765/ | grep -q '<div id="root">'
          test "$(codigo -b /tmp/biscoito http://127.0.0.1:8765/conversas)" = 200
          # O cofre de arquivo: a chave fica fora da pasta do banco, só do usuário.
          python -c "from solis import cofre; s = cofre.selar('chave-de-teste'); assert s.startswith('cofre:v2:') and cofre.abrir(s) == 'chave-de-teste'"
          test "$(stat -c %a /tmp/solis-config/cofre.chave)" = 600
          echo "::notice title=Servidor::de pé no Linux, token conferido (401 sem, 200 com), cofre fechado (600)"

      - name: Avisos na página (abrem sem login)
        if: always()
        run: |
          if [ -f /tmp/instala.txt ] && ! grep -q '^Successfully installed' /tmp/instala.txt; then
            tail -15 /tmp/instala.txt | sed 's/^/::error title=Instalação::/'
          fi
          if [ -f /tmp/testes.txt ]; then
            echo "::notice title=Testes::$(tail -1 /tmp/testes.txt)"
            # A página mostra até 10 avisos por passo: as falhas vão todas num só,
            # uma por linha (%0A), só o nome do teste e o começo do motivo.
            falhas=$(grep -E '^(FAILED|ERROR) ' /tmp/testes.txt | cut -c1-230 | head -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$falhas" ] && echo "::error title=Falharam::$falhas"
          fi
          if [ -f /tmp/solis.log ]; then
            # Cada erro do log com as linhas seguintes (o traceback), num aviso só por erro.
            grep -n -iE 'error|traceback|exception' /tmp/solis.log | cut -d: -f1 | head -4 | while read n; do
              trecho=$(sed -n "$((n-1)),$((n+22))p" /tmp/solis.log | cut -c1-200 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::warning title=Log do servidor (linha $n)::$trecho"
            done
          fi
